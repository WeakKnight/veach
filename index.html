<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Veach WebGPU Path Tracer</title>
		<link rel="icon" href="data:," />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #111;
				color: #ddd;
				font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
				overflow: hidden;
			}
			#viewport {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				touch-action: none;
			}
			#overlay {
				position: fixed;
				top: 8px;
				left: 8px;
				padding: 6px 10px;
				background: rgba(0, 0, 0, 0.55);
				border-radius: 4px;
				pointer-events: none;
				white-space: pre;
			}
			#help {
				position: fixed;
				bottom: 8px;
				left: 8px;
				padding: 6px 10px;
				background: rgba(0, 0, 0, 0.45);
				border-radius: 4px;
				pointer-events: none;
				white-space: pre;
				opacity: 0.8;
			}
			#drop {
				position: fixed;
				inset: 0;
				display: none;
				align-items: center;
				justify-content: center;
				font-size: 20px;
				background: rgba(40, 90, 160, 0.35);
				border: 3px dashed #8bf;
				pointer-events: none;
			}
			body.dragging #drop {
				display: flex;
			}
			#loading {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: min(320px, 80%);
				padding: 12px 16px;
				background: rgba(0, 0, 0, 0.6);
				border-radius: 6px;
				font: 12px/1.5 system-ui, sans-serif;
				pointer-events: none;
			}
			#loading .track {
				height: 4px;
				margin-top: 8px;
				border-radius: 2px;
				background: rgba(255, 255, 255, 0.15);
				overflow: hidden;
			}
			#loading .fill {
				width: 0;
				height: 100%;
				border-radius: 2px;
				background: #8bf;
				transition: width 0.3s ease-out;
			}
			#loading .hint {
				margin-top: 8px;
				font-size: 11px;
				color: #999;
			}
			#error {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				max-width: 70%;
				padding: 16px;
				background: #400;
				color: #fcc;
				border-radius: 4px;
				display: none;
				white-space: pre-wrap;
			}
		</style>
	</head>
	<body>
		<canvas id="viewport"></canvas>
		<div id="overlay"></div>
		<div id="help"></div>
		<div id="drop">Drop .glb / .gltf (+ files) or .hdr</div>
		<div id="loading"><div class="message">Starting</div><div class="track"><div class="fill"></div></div><div class="hint"></div></div>
		<div id="error"></div>
		<script type="module" src="/src/app/main.ts"></script>
	</body>
</html>
